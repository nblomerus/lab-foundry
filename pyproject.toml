# Tooling config for LabFoundry (ruff / pytest / coverage). LabFoundry runs as an
# application, not an installable package: the top-level domain folders (agents/,
# harness/, library/, state/, …) are importable from the repo root — no install
# step. Runtime deps are pinned in requirements.txt (pip-compiled from
# requirements.in); the canonical version lives in the `version` file.

[tool.ruff]
line-length = 122  # matches rag-bench
target-version = "py311"
extend-exclude = ["web", "migrations", ".next", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-ra"
# Per-test wall-clock cap (pytest-timeout). No single test comes near this — the whole suite
# runs in well under a minute — so it only trips on a genuine HANG, failing that one test fast
# instead of stalling CI until the job's hard timeout. (A stale watchdog-loop test once spun
# forever; this is the backstop so a future hang can't stall the build server again.)
timeout = 120
filterwarnings = [
    # Third-party noise, not actionable here: langfuse -> opentelemetry reads
    # importlib.metadata entry points via the deprecated SelectableGroups dict
    # interface on import. Ignore this one specific deprecation by message so
    # every other warning still surfaces.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]
# DB-backed integration tests skip themselves unless DATABASE_URL points at a
# migrated pgvector database (see tests/test_labfoundry_corpus.py).

[tool.coverage.run]
# `eval/` (the retrieval/scout/mimir/graph benchmark harnesses) is measured too — it's
# the tooling we trust to tell us the lab is working, so it carries its own tests.
# `scripts/` is intentionally NOT measured: those are demos and one-off ops utilities,
# not lab runtime. `*/server.py` (thin MCP stdio wrappers) is omitted — the logic they
# expose lives in the client layer, which IS tested.
source = ["agents", "harness", "library", "state", "memory", "skills", "api", "ops", "eval"]
branch = true
omit = [
    "tests/*",
    "*/server.py",                  # thin MCP/FastMCP wrappers (run, not unit-tested)
    "ops/build_model_zoo.py",       # build-time tool; needs optional `huggingface_hub`, not a CI dep
]

[tool.coverage.report]
show_missing = true
# Coverage floor enforced by CI (pytest-cov reads this). CI runs a pgvector Postgres service
# with the schema applied, so DB-backed tests run. The suite covers ~96% across agents,
# harness, library, api, ops, state, and the eval harnesses; the floor is held at 90 with
# headroom for the few DB-only error paths and the dormant market-era experiment runners.
fail_under = 90
