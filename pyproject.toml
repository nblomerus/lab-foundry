# Tooling config for LabFoundry (ruff / pytest / coverage). LabFoundry runs as an
# application, not an installable package: the top-level domain folders (agents/,
# harness/, library/, state/, …) are importable from the repo root — no install
# step. Runtime deps are pinned in requirements.txt (pip-compiled from
# requirements.in); the canonical version lives in the `version` file.

[tool.ruff]
line-length = 122  # matches rag-bench
target-version = "py311"
extend-exclude = ["web", "migrations", ".next", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-ra"
# DB-backed integration tests skip themselves unless DATABASE_URL points at a
# migrated pgvector database (see tests/test_labfoundry_corpus.py).

[tool.coverage.run]
source = ["agents", "harness", "library", "state", "memory", "skills", "api", "ops"]
branch = true
omit = [
    "tests/*",
    "*/server.py",                  # thin MCP/FastMCP wrappers
    # Operational entrypoints — CLIs, one-off build/backfill scripts, and the read-only
    # "first light" dry-run drivers. Validated by running them, not pytest (extends the
    # ops/bootstrap.py precedent to the whole operational layer).
    "ops/*",
    # The Ariadne research-PI + Stage-3 execution layer is LLM-orchestration (needs DeepSeek
    # + Neo4j + the live corpus) — validated by the eval/ harnesses (eval/mimir, eval/retrieval,
    # eval/graph, eval/scouts) and the firstlight dry-runs, not pytest line coverage. The
    # DETERMINISTIC cores stay in the metric and ARE unit-tested (scoring, feedback, grade,
    # schemas, persist). Ratchet these in as their deterministic seams grow unit tests.
    "agents/ariadne/loop.py",
    "agents/ariadne/reflect.py",
    "agents/ariadne/handler.py",
    "agents/researcher/grounded.py",
    "agents/researcher/grounded_handler.py",
    "agents/planner/plan.py",
    "agents/planner/decompose.py",
    "agents/llm.py",
    "agents/mimir/ask.py",
    "library/graph/extract.py",
    "library/graph/field_model.py",
    "api/ariadne.py",
    "api/researcher.py",
]

[tool.coverage.report]
show_missing = true
# Coverage floor enforced by CI (pytest-cov reads this). CI runs a pgvector
# Postgres service with the schema applied, so DB-backed tests run. Ratchet up as
# the suite grows (state/client.py is ~69%; research-loop + corpus methods next).
fail_under = 30
