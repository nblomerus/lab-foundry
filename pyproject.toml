# Tooling config for LabFoundry (ruff / pytest / coverage). LabFoundry runs as an
# application, not an installable package: the top-level domain folders (agents/,
# harness/, library/, state/, …) are importable from the repo root — no install
# step. Runtime deps are pinned in requirements.txt (pip-compiled from
# requirements.in); the canonical version lives in the `version` file.

[tool.ruff]
line-length = 122  # matches rag-bench
target-version = "py311"
extend-exclude = ["web", "migrations", ".next", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-ra"
# DB-backed integration tests skip themselves unless DATABASE_URL points at a
# migrated pgvector database (see tests/test_labfoundry_corpus.py).

[tool.coverage.run]
source = ["agents", "harness", "library", "state", "memory", "skills", "api", "ops"]
branch = true
omit = [
    "tests/*",
    "*/server.py",                  # thin MCP/FastMCP wrappers
    "ops/bootstrap.py",
]

[tool.coverage.report]
show_missing = true
# Coverage floor enforced by CI (pytest-cov reads this). CI runs a pgvector
# Postgres service with the schema applied, so DB-backed tests run. Ratchet up as
# the suite grows (state/client.py is ~69%; research-loop + corpus methods next).
fail_under = 30
