name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BADGE_GIST_ID: ab1796b050ea71cedf5f34a92544aa82

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base ref for the version-increment check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.14  # keep in sync with .pre-commit-config.yaml

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Check version increment
        if: github.event_name == 'pull_request'
        run: |
          CURRENT_VERSION=$(cat version)
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:version" 2>/dev/null || echo "0.0.0")
          python3 - "$CURRENT_VERSION" "$BASE_VERSION" <<'EOF'
          import sys
          def pv(v): return tuple(int(x) for x in v.strip().split("."))
          cur, base = pv(sys.argv[1]), pv(sys.argv[2])
          if cur <= base:
              print(f"❌ version not incremented ({sys.argv[2]} -> {sys.argv[1]}); bump the `version` file.")
              sys.exit(1)
          print(f"✓ version incremented: {sys.argv[2]} -> {sys.argv[1]}")
          EOF

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        # DB-backed integration tests (labfoundry_corpus, librarian_ingest) skip
        # themselves here because DATABASE_URL is unset. To run them in CI, add a
        # `pgvector/pgvector:pg16` service, apply migrations, and set DATABASE_URL
        # (pending a fresh-init-clean migration set — see migration 008 notes).
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  badges:
    name: Update Badges
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Extract coverage percentage
        id: coverage
        run: |
          COV=$(python3 -c "
          import xml.etree.ElementTree as ET
          rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate'])
          print(int(rate * 100))
          ")
          echo "pct=$COV" >> "$GITHUB_OUTPUT"
          if   [ "$COV" -ge 90 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$COV" -ge 75 ]; then echo "color=green"       >> "$GITHUB_OUTPUT"
          elif [ "$COV" -ge 60 ]; then echo "color=yellow"      >> "$GITHUB_OUTPUT"
          else                         echo "color=red"         >> "$GITHUB_OUTPUT"; fi

      - name: Read version
        id: version
        run: echo "ver=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Read Python version
        id: python
        run: echo "ver=$(grep 'PYTHON_VERSION' Makefile | head -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          color: ${{ steps.coverage.outputs.color }}

      - name: Update version badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: version.json
          label: version
          message: ${{ steps.version.outputs.ver }}
          color: blue

      - name: Update Python badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: python.json
          label: python
          message: ${{ steps.python.outputs.ver }}
          color: blue
