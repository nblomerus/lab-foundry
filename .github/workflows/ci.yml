name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base ref for the version-increment check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.14  # keep in sync with .pre-commit-config.yaml

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Check version increment
        if: github.event_name == 'pull_request'
        run: |
          CURRENT_VERSION=$(cat version)
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:version" 2>/dev/null || echo "0.0.0")
          python3 - "$CURRENT_VERSION" "$BASE_VERSION" <<'EOF'
          import sys
          def pv(v): return tuple(int(x) for x in v.strip().split("."))
          cur, base = pv(sys.argv[1]), pv(sys.argv[2])
          if cur <= base:
              print(f"❌ version not incremented ({sys.argv[2]} -> {sys.argv[1]}); bump the `version` file.")
              sys.exit(1)
          print(f"✓ version incremented: {sys.argv[2]} -> {sys.argv[1]}")
          EOF

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        # DB-backed integration tests (labfoundry_corpus, librarian_ingest) skip
        # themselves here because DATABASE_URL is unset. To run them in CI, add a
        # `pgvector/pgvector:pg16` service, apply migrations, and set DATABASE_URL
        # (pending a fresh-init-clean migration set — see migration 008 notes).
        run: pytest --cov=labfoundry --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
