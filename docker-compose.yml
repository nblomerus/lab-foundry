services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-boardroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardroom}
      POSTGRES_DB:       ${POSTGRES_DB:-boardroom}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET:   ${SEARXNG_SECRET:-please-change-me}
    volumes:
      - ./infra/searxng:/etc/searxng:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-boardroom}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Langfuse self-host now requires ClickHouse + Redis + S3 — too heavy for dev.
  # Use Langfuse Cloud instead: https://cloud.langfuse.com (free tier).
  # Set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST in .env.

  # Optional: Zep self-hosted. Comment out and use Zep Cloud if preferred.
  # zep:
  #   image: ghcr.io/getzep/zep:latest
  #   restart: unless-stopped
  #   depends_on:
  #     zep-db:
  #       condition: service_healthy
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     ZEP_STORE_POSTGRES_DSN: postgres://zep:zep@zep-db:5432/zep?sslmode=disable
  #     ZEP_OPENAI_API_KEY: ${OPENAI_API_KEY}
  #
  # zep-db:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER:     zep
  #     POSTGRES_PASSWORD: zep
  #     POSTGRES_DB:       zep
  #   volumes:
  #     - zep-db-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U zep"]

volumes:
  postgres-data:
  neo4j-data:
